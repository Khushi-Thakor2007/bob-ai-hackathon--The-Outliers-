submission:
  title: "Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"

  problem_statement: >
    Unforeseen multimodal supply chain disruptions such as port strikes, severe weather,
    and highway closures create cascading delays, expose millions of dollars of cargo to
    spoiling risks, and leave freight operators stranded with idle fleet assets and manual,
    slow response procedures that take hours per incident.

  solution_summary: >
    We built an AI-powered Supply Chain Control Tower that autonomously detects disruption
    impact across routes, computes deterministic 4-factor risk scores, generates optimized
    multimodal bypass routes and carrier alternatives, dynamically matches idle fleet assets
    for corridor redeployment, monitors real-time IoT cold-chain temperature telemetry for excursions,
    and provides Bob — an operational AI assistant using strict backend tool-calling.

  key_features:
    - "Automated Disruption Impact & Spatial Corridor Analysis without manual tagging"
    - "Deterministic 4-Factor Risk Scoring Engine with transparent, explainable rationales"
    - "Intelligent Multimodal Route & Carrier Optimization comparing ETA, cost, and risk"
    - "Dynamic Fleet Utilisation & Proximity-Based Idle Asset Redeployment Matchmaker"
    - "Real-Time Cold-Chain IoT Sensor Monitoring with automated thermal excursion classification"
    - "Bob AI Assistant powered by strict backend tool-calling and zero hallucination"

  tech_stack:
    languages: ["Python", "TypeScript", "SQL"]
    frameworks: ["FastAPI", "React", "Tailwind CSS", "Vite"]
    ibm_technologies: ["watsonx.ai", "IBM Bob Assistant", "IBM Cloud Architecture"]
    databases: ["PostgreSQL", "SQLite", "SQLAlchemy ORM"]
    other: ["Leaflet", "Lucide React", "Uvicorn", "Pydantic"]

  what_we_are_most_proud_of: >
    The tight coupling of deterministic operational calculation engines with Bob AI's tool-calling
    orchestration. The backend serves as the single source of truth, ensuring zero hallucinated
    metrics while Bob synthesizes actionable decisions, and our one-click simulation controls allow
    judges to see cascading port strike impacts and cold-chain excursions resolved in real time.

  known_limitations: >
    In the hackathon prototype, alternate route waypoints are generated across realistic primary
    Indian freight corridors (Western Dedicated Freight Corridor, NH-48, Mundra/JNPT). Full global
    ocean AIS telemetry integration is planned for subsequent enterprise phases.

